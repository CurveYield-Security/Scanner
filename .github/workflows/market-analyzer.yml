name: Morpho Market Analyzer
# Workflow version: v3

on:
  workflow_dispatch:
    inputs:
      chain_id:
        description: "EVM chain ID (Katana 747474 or Ethereum 1)"
        required: true
        default: "747474"
        type: string
      lookback_days:
        description: "Liquidation history window"
        required: true
        default: "90"
        type: string
      min_delayed_events_per_market:
        description: "Minimum delayed events for a repeated-delay market signal"
        required: true
        default: "2"
        type: string
      max_readiness_lookback_blocks:
        description: "Maximum backward search per event"
        required: true
        default: "50000"
        type: string

permissions:
  contents: write

concurrency:
  group: morpho-scanner-repository-documents
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out saved analysis records
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned read-only dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Validate analyzer syntax
        run: npx esbuild scripts/market_analyzer.ts --bundle --platform=node --format=esm --external:viem --external:@morpho-org/morpho-ts --outfile=/tmp/market_analyzer.js
      - name: Validate configured chain RPC secret
        env:
          RPC_URL: ${{ inputs.chain_id == '747474' && secrets.RPC_KATANA || inputs.chain_id == '1' && secrets.RPC_ETHEREUM || '' }}
        run: |
          if [ -z "$RPC_URL" ]; then
            echo "Missing RPC_KATANA for chain 747474 or RPC_ETHEREUM for chain 1."
            exit 1
          fi
      - name: Query chain-wide liquidation events and analyze execution delay
        env:
          CHAIN_ID: ${{ inputs.chain_id }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          MIN_DELAYED_EVENTS_PER_MARKET: ${{ inputs.min_delayed_events_per_market }}
          MAX_READINESS_LOOKBACK_BLOCKS: ${{ inputs.max_readiness_lookback_blocks }}
          RPC_URL: ${{ inputs.chain_id == '747474' && secrets.RPC_KATANA || inputs.chain_id == '1' && secrets.RPC_ETHEREUM || '' }}
          USDC_TOKEN_ADDRESS: ${{ inputs.chain_id == '747474' && '0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36' || inputs.chain_id == '1' && '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48' || '' }}
          SUSHI_API_KEY: ${{ secrets.SUSHI_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npx tsx scripts/market_analyzer.ts
      - name: Retain analyzer reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-analysis/ package-lock.json
          if git diff --cached --quiet; then
            echo "No analyzer document changes to commit."
          else
            git commit -m "Save Morpho liquidation analysis for chain ${{ inputs.chain_id }}"
            git push
          fi
