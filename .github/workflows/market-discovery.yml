name: Market Discovery
# Workflow version: v10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-discovery.yml'
  workflow_dispatch:
    inputs:
      chain_id:
        description: "EVM chain ID to scan (Katana 747474 or Ethereum 1)"
        default: "747474"
        required: true
        type: string
      forward_horizon_days:
        description: "Constant-rate forward liquidation-risk horizon in days"
        required: true
        default: "30"
        type: string
      force_market_refresh:
        description: "Ignore saved market catalogue cache and fetch it again"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: morpho-scanner-repository-documents
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out saved discovery records
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned read-only dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Validate Market Discovery TypeScript syntax
        run: npx esbuild scripts/market_discovery.ts --bundle --platform=node --format=esm --external:viem --external:@morpho-org/morpho-ts --outfile=/tmp/market_discovery.js
      - name: Validate configured chain RPC secret
        env:
          RPC_URL: ${{ (github.event_name == 'push' || inputs.chain_id == '1') && secrets.RPC_ETHEREUM || inputs.chain_id == '747474' && secrets.RPC_KATANA || '' }}
        run: |
          if [ -z "$RPC_URL" ]; then
            echo "Missing RPC_KATANA for chain 747474 or RPC_ETHEREUM for chain 1."
            exit 1
          fi
      - name: Collect and verify Morpho Blue market data
        env:
          CHAIN_ID: ${{ github.event_name == 'push' && '1' || inputs.chain_id }}
          FORWARD_HORIZON_DAYS: ${{ github.event_name == 'push' && '30' || inputs.forward_horizon_days }}
          RPC_URL: ${{ (github.event_name == 'push' || inputs.chain_id == '1') && secrets.RPC_ETHEREUM || inputs.chain_id == '747474' && secrets.RPC_KATANA || '' }}
          FORCE_MARKET_REFRESH: ${{ github.event_name == 'push' && 'false' || inputs.force_market_refresh }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npx tsx scripts/market_discovery.ts
      - name: Retain reports for future runs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-discovery/ package-lock.json
          if git diff --cached --quiet; then
            echo "No discovery document changes to commit."
          else
            git commit -m "Save market discovery for chain ${{ github.event_name == 'push' && '1' || inputs.chain_id }}"
            # The branch may have advanced after checkout (e.g. another workflow edit).
            # Rebase the completed report commit onto the current origin before push.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to publish discovery after three safe rebases."
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi
