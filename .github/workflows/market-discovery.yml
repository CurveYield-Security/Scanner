name: Market Discovery
# Workflow version: v5

on:
  workflow_dispatch:
    inputs:
      chain_id:
        description: "EVM chain ID to scan (one chain per run)"
        required: true
        type: string
      forward_horizon_days:
        description: "Constant-rate forward liquidation-risk horizon in days"
        required: true
        default: "30"
        type: string
      force_market_refresh:
        description: "Ignore saved market catalogue cache and fetch it again"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: market-discovery-repository-documents
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out saved discovery records
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned read-only dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Market Discovery TypeScript syntax
        run: npx esbuild scripts/market_discovery.ts --bundle --platform=node --format=esm --external:viem --external:@morpho-org/morpho-ts --outfile=/tmp/market_discovery.js
      - name: Collect and verify Morpho Blue market data
        env:
          CHAIN_ID: ${{ inputs.chain_id }}
          FORWARD_HORIZON_DAYS: ${{ inputs.forward_horizon_days }}
          RPC_URL: ${{ secrets.MORPHO_RPC_URL }}
          FORCE_MARKET_REFRESH: ${{ inputs.force_market_refresh }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npx tsx scripts/market_discovery.ts
      - name: Retain reports for future runs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-discovery/
          if git diff --cached --quiet; then
            echo "No discovery document changes to commit."
          else
            git commit -m "Save market discovery for chain ${{ inputs.chain_id }}"
            git push
          fi
